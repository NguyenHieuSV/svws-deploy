# Khớp tài nguyên ĐANG CHẠY trên Render (kiểm tra Dashboard 04/10/2026 — T102 PR-0):
#   • Postgres svws-db-iit7 (dpg-d91nj47avr4c73fo0f9g-a), database svws_gu1s, gói Basic-256mb (có Recovery)
#   • Web service svws-app-iit7, gói Starter (trả phí, không ngủ)
# Sao lưu lớp 2: pg_dump hằng ngày lên Backblaze B2 do scheduler trong app chạy (app/sao_luu.py),
# bật khi đặt đủ các biến BACKUP_B2_* bên dưới trên Dashboard.
databases:
  - name: svws-db-iit7
    plan: basic-256mb
    databaseName: svws_gu1s
    user: svws          # TODO kiểm tra: tên user thực tế trên Dashboard (Connections → Username)

services:
  - type: web
    name: svws-app-iit7
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: svws-db-iit7
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /tmp/svws_storage
      # ---- Sao lưu CSDL lên Backblaze B2 (bucket riêng, private) ----
      - key: BACKUP_B2_ENDPOINT     # vd https://s3.us-west-004.backblazeb2.com
        sync: false
      - key: BACKUP_B2_KEY_ID
        sync: false
      - key: BACKUP_B2_APP_KEY
        sync: false
      - key: BACKUP_B2_BUCKET
        sync: false
      - key: BACKUP_KEEP
        value: "14"
      - key: BACKUP_GIO             # giờ Việt Nam
        value: "2"
