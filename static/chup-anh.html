<style>
:root{
  --ground:#eef3f6;--surface:#fff;--surface-2:#f5f8fa;--line:#d5dfe6;--line-2:#e6edf1;
  --ink:#0f1f2e;--ink-2:#3d5063;--muted:#6a7c8c;--navy:#12304f;--cyan:#0b8aa3;--cyan-soft:#dff2f6;
  --ok:#1f7a4d;--ok-soft:#e1f3e9;--warn:#a86a0c;--warn-soft:#fdf1dc;--bad:#b3261e;--bad-soft:#fbe4e2;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:10px}
header img{height:36px;background:#fff;border-radius:6px;padding:2px 4px}
header b{font-size:16px;font-weight:600;display:block;line-height:1.2}
header span{font-size:12px;opacity:.75}
header .sp{flex:1}
header a{color:#fff;font-size:13px;opacity:.85;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:4px 8px}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
h1{font-size:19px;margin:4px 0 0;font-weight:600}
h2{font-size:16px;margin:0;font-weight:600;display:flex;align-items:center;gap:8px}
.note{font-size:13px;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.i{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:15px;color:var(--ink);min-width:0}
.i:focus{outline:2px solid var(--cyan);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.small{padding:6px 10px;font-size:13px}
.btn.big{flex:1;padding:14px;font-size:16px;min-width:140px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.pick{position:relative;overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.ph .img{position:relative;aspect-ratio:1/1}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .n{position:absolute;left:6px;top:6px;background:var(--navy);color:#fff;font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:5px}
.ph .x{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(15,31,46,.7);color:#fff;font-size:16px;cursor:pointer}
.ph .m{padding:6px;display:flex;flex-direction:column;gap:4px}
.ph select{font-size:13px;padding:6px}
.ph .k{font-size:12px;color:var(--muted)}
.banner{border-radius:9px;padding:10px 12px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.think{display:flex;gap:12px;align-items:center}
.spin{width:20px;height:20px;border-radius:50%;border:2px solid var(--cyan-soft);border-top-color:var(--cyan);animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.cnt{font-family:var(--mono);font-size:12px;background:var(--cyan-soft);color:var(--cyan);padding:1px 8px;border-radius:99px}
.rc{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.rc.warn{border-left-color:var(--warn)} .rc.bad{border-left-color:var(--bad)}
.rc .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.rc .hd .sp{flex:1}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.mono{font-family:var(--mono)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.cy{background:var(--cyan-soft);color:var(--cyan);border-color:transparent}
.val .i{font-family:var(--mono);font-size:17px;font-weight:600}
.flags{display:flex;flex-direction:column;gap:3px}
.flag{font-size:12.5px;line-height:1.35;padding-left:13px;position:relative}
.flag::before{content:"";position:absolute;left:2px;top:6px;width:6px;height:6px;border-radius:50%;background:currentColor}
.flag.warn{color:var(--warn)} .flag.bad{color:var(--bad)} .flag.info{color:var(--muted)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 -4px 16px rgba(18,48,79,.08)}
.bar .sp{flex:1;font-size:13px;color:var(--muted)}
.done li{margin:2px 0}
@media (max-width:420px){.grid2{grid-template-columns:1fr 1fr}}
</style>
</head>

  <div><b>Chụp ảnh → Báo cáo vận hành</b><span id="who">Cho thuê</span></div>
  <div class="sp"></div>
  <button id="btn-cai" hidden style="background:#fff;color:#12304f;border:0;border-radius:6px;padding:5px 10px;font-weight:600;font-size:13px;cursor:pointer">Cài app</button>

</header>
<main id="app"></main>
<div class="bar" id="bar" hidden></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const h=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const vn=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");return m?`${m[3]}/${m[2]}/${m[1]}`:(iso||"—");};
const numv=v=>{if(v===null||v===undefined||v==="")return null;if(typeof v==="number")return v;const n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return Number.isFinite(n)?n:null;};
const fmt=v=>{const n=numv(v);return n===null?"—":n.toLocaleString("vi-VN",{maximumFractionDigits:3});};
const LOAI={may_do_cam_tay:"Máy đo cầm tay",dong_ho_luu_luong:"Đồng hồ lưu lượng",dong_ho_tong:"Đồng hồ tổng",ap_ke:"Áp kế",ong_dong_sv30:"Ống đong SV30",man_hinh_hmi:"Màn hình HMI",so_nhat_ky_viet_tay:"Sổ nhật ký",phieu_phan_tich:"Phiếu phân tích",nhan_thiet_bi:"Nhãn thiết bị",phieu_giao_hang:"Phiếu giao hàng",hoa_don:"Hóa đơn",khac:"Khác"};
const CONF={cao:["ok","Rõ"],tb:["warn","Xem lại"],thap:["bad","Không chắc"],sua:["cy","Đã sửa"]};

let API=location.origin, TOKEN=null;
try{API=(localStorage.getItem("svws_api")||location.origin).replace(/\/$/,"");TOKEN=localStorage.getItem("svws_token");}catch(e){}
const qs=new URLSearchParams(location.search);
const S={login:!TOKEN,err:"",duAn:[],daId:qs.get("da")||"",mau:null,ngay:today(),photos:[],busy:false,
  kq:null,saving:false,saved:{kt:false,hc:false,kl:false,anh:false},doneMsg:null,confirmGiam:false};

async function api(path,opt={}){
  const o={...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+TOKEN}};
  if(opt.body&&!(opt.body instanceof FormData)&&typeof opt.body==="string") o.headers["Content-Type"]="application/json";
  const r=await fetch(API+path,o);
  if(r.status===401){S.login=true;render();throw {status:401,msg:"Phiên đăng nhập hết hạn — đăng nhập lại."};}
  let d=null;try{d=await r.json();}catch(e){}
  if(!r.ok){const m=d&&d.detail?(typeof d.detail==="string"?d.detail:JSON.stringify(d.detail)):("Lỗi "+r.status);throw {status:r.status,msg:m};}
  return d;
}

/* ---------------- render ---------------- */
function render(){
  const app=$("#app"), bar=$("#bar");
  if(S.login){bar.hidden=true;app.innerHTML=viewLogin();return;}
  if(S.doneMsg){bar.hidden=true;app.innerHTML=viewDone();return;}
  app.innerHTML=viewMain();
  if(S.kq){bar.hidden=false;updBar();}else bar.hidden=true;
}
function viewLogin(){
  return `<h1>Đăng nhập</h1><p class="note">Dùng tài khoản app quản trị SVWS.</p>
  <form class="panel" id="loginForm">
    ${S.err?`<div class="banner bad">${h(S.err)}</div>`:""}
    <label class="f">Email<input class="i" id="lg-email" type="email" autocomplete="username" required value="${h((()=>{try{return localStorage.getItem("svws_email")||""}catch(e){return ""}})())}"></label>
    <label class="f">Mật khẩu<input class="i" id="lg-pw" type="password" autocomplete="current-password" required></label>
    <button class="btn primary big" type="submit">Đăng nhập</button>
  </form>`;
}
function daHienTai(){return S.duAn.find(d=>String(d.id)===String(S.daId));}
function locations(){return S.mau?[...new Set((S.mau.ky_thuat||[]).map(c=>c.vi_tri).filter(Boolean))]:[];}
function viewMain(){
  const opts=S.duAn.map(d=>`<option value="${d.id}" ${String(d.id)===String(S.daId)?"selected":""}>${h(d.ten_du_an||d.ma)}${d.ten&&d.ten!==d.ten_du_an?" — "+h(d.ten):""}</option>`).join("");
  const locs=locations();
  const ph=S.photos.map((p,i)=>`<div class="ph"><div class="img"><img src="${p.url}" alt="Ảnh ${i+1}"><span class="n">${i+1}</span><button class="x" data-act="rm" data-i="${i}" aria-label="Bỏ ảnh ${i+1}">×</button></div>
    <div class="m"><select class="i" data-hint="${i}" aria-label="Vị trí ảnh ${i+1}"><option value="">Vị trí: AI đoán</option>${locs.map(l=>`<option ${p.hint===l?"selected":""}>${h(l)}</option>`).join("")}</select>
    ${p.loai?`<span class="k">${h(LOAI[p.loai]||p.loai)}${p.mo_ta?" · "+h(p.mo_ta):""}</span>`:""}</div></div>`).join("");
  const read=S.busy?`<div class="think panel"><div class="spin"></div><div><b>AI đang đọc ${S.photos.length} ảnh…</b><div class="note">Thường 15–60 giây. Đừng tắt màn hình.</div></div></div>`
    :`<button class="btn primary big" data-act="read" ${(!S.photos.length||!S.daId)?"disabled":""}>AI đọc ${S.photos.length||""} ảnh</button>`;
  return `
  ${S.err?`<div class="banner bad">${h(S.err)}</div>`:""}
  <section class="panel">
    <div class="grid2">
      <label class="f" style="grid-column:1/-1">Dự án cho thuê<select class="i" id="sel-da"><option value="">— Chọn dự án —</option>${opts}</select></label>
      <label class="f">Ngày báo cáo<input class="i" type="date" id="in-ngay" value="${h(S.ngay)}"></label>
      <div class="f">Danh mục<span class="note" style="padding-top:8px">${S.mau?`${(S.mau.ky_thuat||[]).length} chỉ tiêu · ${(S.mau.hoa_chat||[]).length} hóa chất · ${(S.mau.khoi_luong||[]).length} đồng hồ`:"—"}</span></div>
    </div>
  </section>
  <section class="panel">
    <h2>Ảnh chụp</h2>
    <div class="row">
      <span class="btn navy big pick">Chụp ảnh<input type="file" accept="image/*" capture="environment" id="in-cam"></span>
      <span class="btn big pick">Chọn ảnh<input type="file" accept="image/*" multiple id="in-lib"></span>
    </div>
    ${S.photos.length?`<div class="photos">${ph}</div>`:`<p class="note">Chụp thẳng mặt máy đo / đồng hồ, lấy trọn thang đo và tag (vd. SP RO1). Phiếu giao hóa chất: chụp trọn tờ. Tối đa 10 ảnh mỗi lần.</p>`}
    ${read}
  </section>
  ${S.kq?viewKq():""}`;
}
function sev(cb){return (cb||[]).some(c=>c.muc==="bad")?"bad":(cb||[]).some(c=>c.muc==="warn")?"warn":"";}
function flags(cb){return (cb&&cb.length)?`<div class="flags">${cb.map(c=>`<span class="flag ${h(c.muc)}">${h(c.noi_dung)}</span>`).join("")}</div>`:"";}
function head(r,sec,i){const c=CONF[r.tin_cay];return `<div class="hd">${r.anh?`<span class="chip mono">Ảnh ${r.anh}</span>`:`<span class="chip">Nhập tay</span>`}${c?`<span class="chip ${c[0]}">${c[1]}</span>`:""}${r.trong_mau===false?`<span class="chip">Ngoài danh mục</span>`:""}<span class="sp"></span><button class="del" data-act="del" data-s="${sec}" data-i="${i}">Xóa dòng</button></div>`;}
function viewKq(){
  const k=S.kq, m=S.mau||{};
  const dlVt=`<datalist id="dl-vt">${locations().map(x=>`<option value="${h(x)}">`).join("")}</datalist>`;
  const dlCt=`<datalist id="dl-ct">${[...new Set((m.ky_thuat||[]).map(c=>c.chi_tieu))].map(x=>`<option value="${h(x)}">`).join("")}</datalist>`;
  const dlHc=`<datalist id="dl-hc">${(m.hoa_chat||[]).map(c=>`<option value="${h(c.ten)}">`).join("")}</datalist>`;
  const dlKl=`<datalist id="dl-kl">${(m.khoi_luong||[]).map(c=>`<option value="${h(c.he_thong)}">`).join("")}</datalist>`;
  const kt=k.ky_thuat.map((r,i)=>`<div class="rc ${sev(r.canh_bao)}">${head(r,"ky_thuat",i)}
    <div class="grid2">
      <label class="f">Vị trí<input class="i" list="dl-vt" data-b="ky_thuat:${i}:vi_tri" value="${h(r.vi_tri)}"></label>
      <label class="f">Chỉ tiêu<input class="i" list="dl-ct" data-b="ky_thuat:${i}:chi_tieu" value="${h(r.chi_tieu)}"></label>
      <label class="f val">Kết quả${r.don_vi?` (${h(r.don_vi)})`:""}<input class="i" inputmode="decimal" data-b="ky_thuat:${i}:ket_qua" value="${h(r.ket_qua)}"></label>
      <label class="f">Ngày<input class="i" type="date" data-b="ky_thuat:${i}:ngay" value="${h(r.ngay)}"></label>
      <label class="f" style="grid-column:1/-1">Ghi chú<input class="i" data-b="ky_thuat:${i}:ghi_chu" value="${h(r.ghi_chu)}"></label>
    </div>${r.lan_truoc?`<span class="note">Lần trước: ${h(r.lan_truoc.ket_qua)} (${vn(r.lan_truoc.ngay)})</span>`:""}${flags(r.canh_bao)}</div>`).join("");
  const hc=k.hoa_chat.map((r,i)=>`<div class="rc ${sev(r.canh_bao)}">${head(r,"hoa_chat",i)}
    <div class="grid2">
      <label class="f" style="grid-column:1/-1">Hóa chất - vật tư<input class="i" list="dl-hc" data-b="hoa_chat:${i}:ten" value="${h(r.ten)}"></label>
      <label class="f val">Lượng nhập${r.don_vi?` (${h(r.don_vi)})`:""}<input class="i" inputmode="decimal" data-b="hoa_chat:${i}:luong_nhap" value="${h(r.luong_nhap??"")}"></label>
      <label class="f val">Tồn cuối ngày<input class="i" inputmode="decimal" data-b="hoa_chat:${i}:luong_ton" value="${h(r.luong_ton??"")}" placeholder="bắt buộc"></label>
      <label class="f">Ngày<input class="i" type="date" data-b="hoa_chat:${i}:ngay" value="${h(r.ngay)}"></label>
      <label class="f">Ghi chú<input class="i" data-b="hoa_chat:${i}:ghi_chu" value="${h(r.ghi_chu)}"></label>
    </div>${r.ton_truoc?`<span class="note">Tồn lần trước: ${fmt(r.ton_truoc.luong_ton)} ${h(r.don_vi||"")} (${vn(r.ton_truoc.ngay)})</span>`:""}${flags(r.canh_bao)}</div>`).join("");
  const kl=k.khoi_luong.map((r,i)=>`<div class="rc ${sev(r.canh_bao)}">${head(r,"khoi_luong",i)}
    <div class="grid2">
      <label class="f" style="grid-column:1/-1">Hệ thống (đồng hồ)<input class="i" list="dl-kl" data-b="khoi_luong:${i}:he_thong" value="${h(r.he_thong)}"></label>
      <label class="f val">Chỉ số (${h(r.don_vi||"m3")})<input class="i" inputmode="decimal" data-b="khoi_luong:${i}:chi_so" value="${h(r.chi_so??"")}"></label>
      <label class="f">Ngày<input class="i" type="date" data-b="khoi_luong:${i}:ngay" value="${h(r.ngay)}"></label>
    </div>${r.lan_truoc?`<span class="note">Lần trước: ${fmt(r.lan_truoc.chi_so)} (${vn(r.lan_truoc.ngay)})</span>`:""}${flags(r.canh_bao)}</div>`).join("");
  const sec=(t,key,body,n,savedKey)=>`<section class="panel"><h2>${t} <span class="cnt">${n}</span>${S.saved[savedKey]?`<span class="chip ok">Đã lưu</span>`:""}</h2>${body||`<p class="note">Không có số liệu.</p>`}${S.saved[savedKey]?"":`<div><button class="btn small" data-act="add" data-s="${key}">+ Thêm dòng</button></div>`}</section>`;
  return dlVt+dlCt+dlHc+dlKl
   + sec("Báo cáo kỹ thuật","ky_thuat",kt,k.ky_thuat.length,"kt")
   + sec("Hóa chất - vật tư","hoa_chat",hc,k.hoa_chat.length,"hc")
   + sec("Khối lượng (chỉ số nước)","khoi_luong",kl,k.khoi_luong.length,"kl")
   + (S.confirmGiam?`<div class="banner bad">${h(S.confirmGiam)}<div class="row" style="margin-top:8px"><button class="btn small" data-act="giam-ok">Đúng — đã thay/reset đồng hồ, vẫn lưu</button><button class="btn small" data-act="giam-no">Để em sửa lại số</button></div></div>`:"");
}
function counts(){const k=S.kq;return {kt:k.ky_thuat.filter(r=>String(r.ket_qua??"").trim()!=="").length,hc:k.hoa_chat.filter(r=>numv(r.luong_ton)!==null).length,hcThieu:k.hoa_chat.filter(r=>numv(r.luong_ton)===null).length,kl:k.khoi_luong.filter(r=>numv(r.chi_so)!==null&&r.he_thong).length};}
function barState(){const c=counts();const tong=(S.saved.kt?0:c.kt)+(S.saved.hc?0:c.hc)+(S.saved.kl?0:c.kl);
  return {txt:`${tong} dòng sẽ lưu${c.hcThieu&&!S.saved.hc?` · ${c.hcThieu} dòng hóa chất thiếu tồn (bỏ qua)`:""}`,dis:S.saving||(!tong&&S.saved.anh),lbl:S.saving?"Đang lưu…":"Lưu vào BCVH"};}
function viewBar(){return `<span class="sp" id="bar-txt"></span><button class="btn" data-act="discard">Hủy</button><button class="btn primary" data-act="save" id="bar-save"></button>`;}
function updBar(){const b=$("#bar");if(!b||b.hidden)return;if(!$("#bar-save"))b.innerHTML=viewBar();const st=barState();$("#bar-txt").textContent=st.txt;const btn=$("#bar-save");btn.disabled=st.dis;btn.textContent=st.lbl;}
function viewDone(){const d=S.doneMsg;return `<h1>Đã lưu</h1><section class="panel"><div class="banner ok">Số liệu đã vào Báo cáo vận hành của dự án ${h(d.da)}.</div><ul class="done">${d.items.map(x=>`<li>${h(x)}</li>`).join("")}</ul>
  <div class="row"><button class="btn primary big" data-act="again">Chụp tiếp</button><a class="btn big" href="/">Mở app quản trị</a></div></section>`;}

/* ---------------- actions ---------------- */
async function loadDuAn(){
  try{S.duAn=await api("/cho-thue/tai-san");
    if(!S.daId){try{S.daId=localStorage.getItem("svws_chup_da")||"";}catch(e){}}
    if(S.daId&&!daHienTai())S.daId="";
    if(!S.daId&&S.duAn.length===1)S.daId=String(S.duAn[0].id);
    try{const me=await api("/auth/me");$("#who").textContent=me.email||"Cho thuê";}catch(e){}
    if(S.daId)await loadMau();
  }catch(e){if(e.status!==401)S.err=e.status===403?"Tài khoản này chưa có quyền module Cho thuê.":e.msg;}
  render();
}
async function loadMau(){S.mau=null;if(!S.daId)return;try{S.mau=await api(`/cho-thue/tai-san/${S.daId}/mau-bcvh`);}catch(e){if(e.status!==401)S.err=e.msg;}}
async function shrink(file){ // thu nhỏ ≤1800px JPEG để gửi nhanh và dưới trần 5 MB/ảnh
  try{const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});const s=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.86));}catch(e){return file;}
}
async function read(){
  if(S.busy||!S.photos.length||!S.daId)return;
  S.busy=true;S.err="";render();
  try{
    const fd=new FormData();
    S.photos.forEach((p,i)=>fd.append("files",p.blob,`anh${i+1}.jpg`));
    fd.append("ngay",S.ngay);fd.append("goi_y",JSON.stringify(S.photos.map(p=>p.hint||"")));
    const kq=await api(`/cho-thue/tai-san/${S.daId}/doc-anh`,{method:"POST",body:fd});
    S.mau=kq.mau||S.mau;
    (kq.anh||[]).forEach(a=>{const p=S.photos[a.so-1];if(p){p.loai=a.loai;p.mo_ta=a.mo_ta;}});
    S.kq={ky_thuat:kq.ky_thuat||[],hoa_chat:kq.hoa_chat||[],khoi_luong:kq.khoi_luong||[]};
    S.saved={kt:false,hc:false,kl:false,anh:false};
    if(!S.kq.ky_thuat.length&&!S.kq.hoa_chat.length&&!S.kq.khoi_luong.length)S.err="AI không tìm thấy số liệu nào trong ảnh. Chụp gần và thẳng hơn rồi đọc lại.";
  }catch(e){if(e.status!==401)S.err=e.msg||"Không đọc được ảnh.";}
  finally{S.busy=false;render();}
}
function groupBy(rows){const m=new Map();rows.forEach(r=>{const k=r.ngay||S.ngay;if(!m.has(k))m.set(k,[]);m.get(k).push(r);});return m;}
async function save(giam){
  if(S.saving)return; S.saving=true;S.err="";S.confirmGiam=false;render();
  const k=S.kq, done=[];
  try{
    if(!S.saved.kt){const rows=k.ky_thuat.filter(r=>String(r.ket_qua??"").trim()!=="");let n=0;
      for(const [ngay,g] of groupBy(rows)){const r=await api(`/cho-thue/tai-san/${S.daId}/bao-cao-kt`,{method:"POST",body:JSON.stringify({ngay,dong:g.map(x=>({vi_tri:x.vi_tri||null,chi_tieu:(x.trong_mau===false&&x.don_vi&&!/\(.*\)/.test(x.chi_tieu))?`${x.chi_tieu} (${x.don_vi})`:x.chi_tieu,ket_qua:String(x.ket_qua).trim(),ghi_chu:x.ghi_chu||null}))})});n+=r.so_dong||0;}
      S.saved.kt=true;if(n)done.push(`Báo cáo kỹ thuật: ${n} dòng`);}
    if(!S.saved.hc){const rows=k.hoa_chat.filter(r=>numv(r.luong_ton)!==null&&r.ten);let n=0;
      for(const [ngay,g] of groupBy(rows)){const r=await api(`/cho-thue/tai-san/${S.daId}/bao-cao-hc`,{method:"POST",body:JSON.stringify({ngay,dong:g.map(x=>({ten:x.ten,luong_nhap:numv(x.luong_nhap),luong_ton:numv(x.luong_ton),don_vi:x.don_vi||null,ghi_chu:x.ghi_chu||null}))})});n+=r.so_dong||0;}
      S.saved.hc=true;if(n)done.push(`Hóa chất - vật tư: ${n} dòng`);}
    if(!S.saved.kl){const rows=k.khoi_luong.filter(r=>numv(r.chi_so)!==null&&r.he_thong);let n=0;
      for(const [ngay,g] of groupBy(rows)){const r=await api(`/cho-thue/tai-san/${S.daId}/bao-cao-kl${giam?"?cho_phep_giam=true":""}`,{method:"POST",body:JSON.stringify({ngay,dong:g.map(x=>({he_thong:x.he_thong,chi_so:numv(x.chi_so),don_vi:x.don_vi||null,ghi_chu:x.ghi_chu||null}))})});n+=r.so_dong||0;}
      S.saved.kl=true;if(n)done.push(`Khối lượng: ${n} chỉ số`);}
    if(!S.saved.anh){let n=0;
      for(let i=0;i<S.photos.length;i++){const p=S.photos[i];if(p.tepId){n++;continue;}
        const fd=new FormData();fd.append("file",p.blob,`BCVH_${S.ngay}_anh${i+1}.jpg`);fd.append("loai","KHAC");
        fd.append("ten",`Ảnh BCVH ${vn(S.ngay)} #${i+1}${p.mo_ta?" — "+p.mo_ta:(p.loai?" — "+(LOAI[p.loai]||p.loai):"")}`.slice(0,250));
        const r=await api(`/cho-thue/du-an/${S.daId}/tai-lieu`,{method:"POST",body:fd});p.tepId=r&&r.id||true;n++;}
      S.saved.anh=true;if(n)done.push(`${n} ảnh gốc lưu vào Tài liệu dự án`);}
    const da=daHienTai();S.doneMsg={da:da?(da.ten_du_an||da.ma):"",items:done.length?done:["Không có dòng nào để lưu."]};
  }catch(e){
    if(e.status===409&&String(e.msg).includes("GIẢM"))S.confirmGiam=e.msg;
    else if(e.status!==401)S.err="Chưa lưu hết: "+(e.msg||"lỗi")+". Phần đã lưu được đánh dấu — bấm Lưu lại để lưu tiếp.";
    if(done.length)S.err=(S.err?S.err+" ":"")+"Đã lưu: "+done.join("; ")+".";
  }finally{S.saving=false;render();window.scrollTo({top:0});}
}
function blank(sec){const d={anh:null,ngay:S.ngay,tin_cay:"sua",canh_bao:[],trong_mau:true};
  if(sec==="ky_thuat")return {...d,vi_tri:"",chi_tieu:"",ket_qua:"",don_vi:"",ghi_chu:""};
  if(sec==="hoa_chat")return {...d,ten:"",luong_nhap:null,luong_ton:null,don_vi:"",ghi_chu:""};
  return {...d,he_thong:"",chi_so:null,don_vi:"m3",ghi_chu:""};}

document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="loginForm")return; ev.preventDefault();
  const email=$("#lg-email").value.trim(), pw=$("#lg-pw").value;
  try{const r=await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({username:email,password:pw})});
    if(!r.ok){let d=null;try{d=await r.json()}catch(e){};throw new Error(d&&d.detail||"Sai email hoặc mật khẩu");}
    TOKEN=(await r.json()).access_token;try{localStorage.setItem("svws_token",TOKEN);localStorage.setItem("svws_email",email);}catch(e){}
    S.login=false;S.err="";render();loadDuAn();
  }catch(e){S.err=e.message;render();}
});
document.addEventListener("click",async ev=>{
  const a=ev.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="rm"){const i=+a.dataset.i;URL.revokeObjectURL(S.photos[i].url);S.photos.splice(i,1);render();}
  else if(act==="read")read();
  else if(act==="del"){S.kq[a.dataset.s].splice(+a.dataset.i,1);render();}
  else if(act==="add"){S.kq[a.dataset.s].push(blank(a.dataset.s));render();}
  else if(act==="discard"){S.kq=null;S.err="";render();}
  else if(act==="save")save(false);
  else if(act==="giam-ok")save(true);
  else if(act==="giam-no"){S.confirmGiam=false;render();}
  else if(act==="again"){S.photos.forEach(p=>URL.revokeObjectURL(p.url));S.photos=[];S.kq=null;S.doneMsg=null;S.err="";S.ngay=today();render();}
});
document.addEventListener("change",async ev=>{
  const el=ev.target;
  if(el.id==="in-cam"||el.id==="in-lib"){const fs=[...el.files];el.value="";
    for(const f of fs){if(S.photos.length>=10){S.err="Tối đa 10 ảnh mỗi lần đọc.";break;}const b=await shrink(f);S.photos.push({blob:b,url:URL.createObjectURL(b),hint:"",loai:"",mo_ta:""});}
    render();return;}
  if(el.id==="sel-da"){S.daId=el.value;try{localStorage.setItem("svws_chup_da",S.daId)}catch(e){};S.kq=null;await loadMau();render();return;}
  if(el.id==="in-ngay"){S.ngay=el.value||today();return;}
  if(el.dataset.hint!==undefined){S.photos[+el.dataset.hint].hint=el.value;return;}
  if(el.dataset.b)updBar();
});
document.addEventListener("input",ev=>{
  const b=ev.target.dataset&&ev.target.dataset.b;if(!b||!S.kq)return;
  const [sec,i,f]=b.split(":");const r=S.kq[sec][+i];if(!r)return;
  r[f]=ev.target.value;if(r.tin_cay!=="cao")r.tin_cay="sua";
  updBar();
});

render();
if(!S.login)loadDuAn();

/* --- Cài như app (PWA) --- */
if("serviceWorker" in navigator){navigator.serviceWorker.register("/chup-anh-sw.js",{scope:"/chup-anh"}).catch(()=>{});}
let hoiCai=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();hoiCai=e;$("#btn-cai").hidden=false;});
$("#btn-cai").addEventListener("click",async()=>{if(!hoiCai)return;hoiCai.prompt();try{await hoiCai.userChoice;}catch(e){}hoiCai=null;$("#btn-cai").hidden=true;});
window.addEventListener("appinstalled",()=>{$("#btn-cai").hidden=true;});
// Chạy dạng app (không thanh địa chỉ): nút "App" mở app quản trị trong trình duyệt thay vì kẹt trong khung app
if(window.matchMedia("(display-mode: standalone)").matches||navigator.standalone){$("#lnk-app").target="_blank";}
})();
</script>
